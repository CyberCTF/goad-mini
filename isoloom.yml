# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD-Mini (Game of Active Directory, by Orange Cyberdefense): one domain on one Windows
# server. Isoloom builds the machine; GOAD's own playbooks build the lab from a controller.
version: 1
name: goad-mini

networks:
  lab: { cidr: 192.168.56.0/24 }

machines:
  dc01:   # kingslanding: sevenkingdoms.local
    networks: { lab: 10 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

provision:
  - ansible: ansible/goad-mini.yml
    requirements: ansible/requirements_311.yml
    # The lab's own per-host variables (which domain each machine belongs to) and the keyboard layouts.
    inventory: [ad/GOAD-Mini/data/inventory]
    # What each machine plays in the lab: the groups GOAD's playbooks target.
    groups:
      domain: [dc01]
      dc: [dc01]
      parent_dc: [dc01]
      adcs: [dc01]
      no_update: [dc01]
      defender_on: [dc01]
    # The lab's settings, as GOAD's playbooks read them.
    vars:
      domain_name: GOAD-Mini
      admin_user: administrator
      force_dns_server: 'no'
      dns_server: 'x.x.x.x'
      dns_server_forwarder: 1.1.1.1
      enable_http_proxy: 'no'
      ad_http_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      ad_https_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      add_route: 'no'
      route_gateway: 192.168.56.1
      route_network: 10.0.0.0/8
      proxy_ip: 'x.x.x.x'
      proxy_port: '8080'

message: |
  GOAD-Mini is up: kingslanding (sevenkingdoms.local) at {{ machines.dc01.addresses.lab }}.
